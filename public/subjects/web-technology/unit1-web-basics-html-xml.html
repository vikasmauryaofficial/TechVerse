<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script></head><body><script src="engine.js"></script><script>
const F=(n,s)=>['flow',n,s];
build('Unit 1 · Web Basics, HTML & XML',[
{g:'INTRODUCTION',t:'Introduction and Web Development Strategies',th:['Web development = building websites/web apps: front end (what the user sees), back end (server logic), database.','Strategy: gather requirements, design, develop, test, deploy, maintain. Choose a tech stack that fits the need.'],code:`Front end : HTML + CSS + JavaScript\nBack end  : Servlet/JSP, Node.js\nDatabase  : MySQL, MongoDB`,d:F(['Plan','Design','Build','Deploy'],[[0,1,'Requirements gathered'],[1,2,'Wireframes and layout approved'],[2,3,'Code, test, then publish'],[3,0,'Feedback leads to the next version']])},
{g:'INTRODUCTION',t:'History of Web and Internet',th:['Internet = global network of networks (hardware, cables, routers). Web = a service on the Internet (HTTP + HTML pages).','Click a year to see the milestone.'],code:`Internet : the roads\nWeb      : the shops built along the roads\nEmail, FTP also run on the Internet, but are not the Web.`,d:['chips',{'1969':'ARPANET: first packet-switched network (USA).','1983':'TCP/IP becomes the standard of ARPANET: birth of the Internet.','1989':'Tim Berners-Lee proposes the World Wide Web at CERN.','1991':'First website and web server go public.','1993':'Mosaic, first popular graphical browser.','1995':'JavaScript and Java appear; commercial Internet grows.','2000s':'Web 2.0: social media, AJAX, mobile web.'}]},
{g:'INTRODUCTION',t:'Protocols Governing Web',th:['A protocol is a set of rules for communication. Web uses a layered set called TCP/IP.','Click a protocol.'],code:`HTTP 80 | HTTPS 443 | FTP 21 | SMTP 25 | DNS 53 | POP3 110 | IMAP 143`,d:['chips',{'HTTP':'Transfers web pages. Stateless request/response (port 80).','HTTPS':'HTTP over TLS/SSL: encrypted (port 443).','TCP/IP':'IP addresses and routes packets; TCP makes delivery reliable and ordered.','DNS':'Converts names (abes.ac.in) to IP addresses.','FTP':'File upload/download (port 21).','SMTP/POP3/IMAP':'SMTP sends mail; POP3/IMAP receive mail.'}]},
{g:'INTRODUCTION',t:'Writing Web Projects',th:['Keep structure, style and behaviour separate. Use a clear folder layout and meaningful file names.','Click a file.'],code:`myproject/\n  index.html\n  css/style.css\n  js/script.js\n  images/logo.png`,d:['chips',{'index.html':'Home page; servers open it by default.','style.css':'Look: colours, fonts, layout.','script.js':'Behaviour: validation, events, AJAX.','images/':'Pictures; compress them for speed.','Testing':'Check in several browsers and screen sizes before deployment.'}]},
{g:'INTRODUCTION',t:'Connecting to Internet',th:['You connect through an ISP (Internet Service Provider) using a modem/router or mobile network.','Click a connection type.'],code:`Device → Modem/Router → ISP → Internet backbone → Web server`,d:['chips',{'Dial-up':'Old, uses telephone line, ~56 kbps.','Broadband/DSL':'Always-on over telephone wire, Mbps speeds.','Fibre (FTTH)':'Light signals through glass: fastest and most reliable.','Wi-Fi':'Wireless link to your router; router is still wired to the ISP.','Mobile 4G/5G':'Internet through cellular towers.','Leased line':'Dedicated line for institutions, fixed speed.'}]},
{g:'INTRODUCTION',t:'Internet Services and Tools',th:['Services: WWW, email, FTP, Telnet/SSH, search engines, chat/VoIP.','Tools: browsers, ping, tracert, nslookup. Click a command to see typical output.'],code:`ping host      test reachability\ntracert host   show route (traceroute on Linux)\nnslookup host  DNS lookup`,d:['cmd',{'ping abes.ac.in':'Reply from <server IP>: bytes=32 time=18ms TTL=56\n4 sent, 4 received, 0% loss','tracert abes.ac.in':'1  192.168.1.1 (your router)\n2  ISP gateway\n3  ... backbone routers\n4  destination reached','nslookup abes.ac.in':'Name: abes.ac.in\nAddress: <IP address of the site>','ipconfig':'IPv4 Address . . : 192.168.x.x\nDefault Gateway : 192.168.x.1'}]},
{g:'INTRODUCTION',t:'Client-Server Computing',th:['Client requests a service; server provides it. Browser = client, web server = server.','Two-tier: client ↔ DB server. Three-tier: client ↔ web/app server ↔ database (used on the web).'],code:`GET /index.html HTTP/1.1\nHost: abes.ac.in`,d:F(['Browser (client)','Web server','Database','Browser (page)'],[[0,1,'HTTP request'],[1,2,'query'],[2,1,'data'],[1,3,'HTML response']])},
{g:'HTML',t:'HTML Lists',th:['<ul> unordered, <ol> ordered, <li> items, <dl> definition list. Lists can be nested.'],code:`<h3>Subjects</h3>\n<ul>\n  <li>Web Technology</li>\n  <li>DBMS\n    <ol type="a"><li>SQL</li><li>Normalization</li></ol>\n  </li>\n</ul>\n<dl><dt>HTML</dt><dd>Markup language</dd></dl>`,d:['try']},
{g:'HTML',t:'HTML Tables',th:['<table>, <tr> row, <th> heading, <td> data. Use colspan/rowspan to merge cells.'],code:`<table border="1" cellpadding="6">\n  <tr><th>Roll</th><th>Name</th><th>Marks</th></tr>\n  <tr><td>1</td><td>Asha</td><td>78</td></tr>\n  <tr><td colspan="2">Total</td><td>78</td></tr>\n</table>`,d:['try']},
{g:'HTML',t:'HTML Images',th:['<img src alt width height>. alt text is shown if the image fails and helps screen readers.','Image links: wrap <img> inside <a>. Image maps use <map> and <area>.'],code:`<img alt="demo" width="120"\n src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='60'><rect width='100' height='60' fill='orange'/></svg>">\n<a href="https://example.com"><img alt="link" width="60"\n src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60'><circle cx='30' cy='30' r='28' fill='teal'/></svg>"></a>`,d:['try']},
{g:'HTML',t:'HTML Frames',th:['Old <frameset>/<frame> split the window into pages; removed in HTML5.','Modern replacement: <iframe> embeds one page inside another.'],code:`<h3>Parent page</h3>\n<iframe width="300" height="100"\n  srcdoc="<h4 style='color:green'>I am inside an iframe</h4>"></iframe>`,d:['try']},
{g:'HTML',t:'HTML Forms',th:['<form action method> collects user input. Controls: input (text, password, radio, checkbox), select, textarea, button.','method GET shows data in URL; POST hides it.'],code:`<form onsubmit="alert('Hello '+n.value);return false">\n  Name: <input id="n" required><br>\n  Gender: <input type="radio" name="g"> M <input type="radio" name="g"> F<br>\n  Course: <select><option>B.Tech</option><option>MCA</option></select><br>\n  <textarea placeholder="Comments"></textarea><br>\n  <button>Submit</button>\n</form>`,d:['try']},
{g:'XML',t:'XML: Document Type Definition (DTD)',th:['XML = your own tags to describe data. Well-formed: one root, every tag closed, proper nesting, case-sensitive.','DTD defines the allowed structure. Valid = well-formed + follows DTD. Click a symbol.'],code:`<!DOCTYPE student [\n  <!ELEMENT student (name, marks+)>\n  <!ELEMENT name  (#PCDATA)>\n  <!ELEMENT marks (#PCDATA)>\n  <!ATTLIST student roll CDATA #REQUIRED>\n]>\n<student roll="7"><name>Asha</name><marks>78</marks></student>`,d:['chips',{'#PCDATA':'Parsed character data: plain text.','+':'One or more occurrences.','*':'Zero or more occurrences.','?':'Zero or one occurrence.','|':'Choice: (a | b).','#REQUIRED':'Attribute must be present.','ELEMENT / ATTLIST':'ELEMENT declares tags; ATTLIST declares attributes.'}]},
{g:'XML',t:'XML Schemas (XSD)',th:['XSD is written in XML itself, supports data types (xs:int, xs:date) and namespaces: more powerful than DTD.','Click a difference.'],code:`<xs:schema xmlns:xs="http://www.w3.org/2001/XMLSchema">\n  <xs:element name="student">\n    <xs:complexType><xs:sequence>\n      <xs:element name="name" type="xs:string"/>\n      <xs:element name="marks" type="xs:int"/>\n    </xs:sequence></xs:complexType>\n  </xs:element>\n</xs:schema>`,d:['chips',{'Syntax':'DTD is special syntax; XSD is ordinary XML.','Data types':'DTD only has text; XSD has int, date, boolean and custom types.','Namespaces':'XSD supports them; DTD does not.','Simple types':'xs:string, xs:int, xs:decimal, xs:date, xs:boolean.','Complex types':'Elements containing other elements or attributes.'}]},
{g:'XML',t:'Object Models, Presenting and Using XML',th:['XML is read as a tree (DOM). Edit the XML below and click Parse to see the tree or error messages for non well-formed XML.','Present XML in browsers using CSS or XSLT; use it for data exchange, config files, RSS.'],code:`<college>\n  <student roll="1"><name>Asha</name></student>\n  <student roll="2"><name>Ravi</name></student>\n</college>`,d:['xml']},
{g:'XML',t:'XML Processors: DOM and SAX',th:['DOM parser loads the whole document as a tree in memory: random access, easy edits, heavy memory.','SAX parser reads sequentially and fires events (startElement, characters, endElement): fast, low memory, read-only.'],code:`// DOM\nDocument d = DocumentBuilderFactory.newInstance().newDocumentBuilder().parse("a.xml");\nNodeList l = d.getElementsByTagName("name");\n// SAX\nclass H extends DefaultHandler {\n  public void startElement(String u,String l,String q,Attributes a){ System.out.println(q); }\n}`,d:F(['XML file','SAX parser','Handler','DOM tree'],[[0,1,'reads top to bottom'],[1,2,'event: startElement'],[2,1,'event: characters, endElement'],[0,3,'DOM: whole file loaded as tree']])}
],{xml(el,t){el.innerHTML='<textarea style="width:100%;height:120px"></textarea><button>Parse</button><pre class="log"></pre>';const ta=el.querySelector('textarea'),o=el.querySelector('pre');ta.value=t.code;
const w=(n,d)=>(n.nodeType==1?'  '.repeat(d)+'<'+n.nodeName+'>'+[...n.attributes].map(a=>' @'+a.name+'="'+a.value+'"').join('')+'\n'+[...n.childNodes].map(c=>w(c,d+1)).join(''):n.nodeType==3&&n.textContent.trim()?'  '.repeat(d)+'"'+n.textContent.trim()+'"\n':'');
el.querySelector('button').onclick=()=>{const x=new DOMParser().parseFromString(ta.value,'application/xml'),e=x.querySelector('parsererror');o.textContent=e?'NOT well-formed:\n'+e.textContent.slice(0,200):'Well-formed. DOM tree:\n'+w(x.documentElement,0)}}});
</script></body></html>
