<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script></head><body><script src="engine.js"></script><script>
const F=(n,s)=>['flow',n,s];
const J=(t,th,code)=>({g:'JAVASCRIPT',t,th,code,d:['try']});
build('Unit 3 · JavaScript & Networking',[
J('JavaScript: Introduction',['JavaScript is a lightweight, interpreted scripting language that runs in the browser to make pages interactive.','Add with <script> in head/body or an external file (<script src="a.js">). Output: alert(), console.log(), document.write(), innerHTML.'],`<h3 id="t">Hello</h3>\n<button onclick="hi()">Click me</button>\n<script>\n  var n = 5; let s = "JS"; const pi = 3.14;\n  function hi() {\n    document.getElementById("t").innerHTML = s + " says hi, n+1 = " + (n + 1);\n  }\n<\/script>`),
J('JavaScript: Documents (DOM)',['The browser turns the page into a tree: the document object. JS can find, change, add and remove elements.','getElementById, querySelector, createElement, appendChild, style, innerHTML, addEventListener.'],`<ul id="list"><li>one</li></ul>\n<button onclick="add()">Add item</button> <button onclick="red()">Colour</button>\n<script>\n  var c = 1;\n  function add(){ var li = document.createElement("li"); li.textContent = "item " + (++c);\n    document.getElementById("list").appendChild(li); }\n  function red(){ document.querySelector("li").style.color = "crimson"; }\n<\/script>`),
J('JavaScript: Forms',['Access fields via document.forms or getElementById; validate in onsubmit and return false to stop sending.','Common checks: empty, length, pattern (regex), password match.'],`<form onsubmit="return check()">\n  Name <input id="n"><br>Email <input id="e"><br>\n  <button>Submit</button> <span id="m" style="color:crimson"></span>\n</form>\n<script>\n  function check(){\n    var m = document.getElementById("m");\n    if (n.value.length < 3) { m.textContent = "Name needs 3+ letters"; return false; }\n    if (!/^\\S+@\\S+\\.\\S+$/.test(e.value)) { m.textContent = "Invalid email"; return false; }\n    m.style.color = "green"; m.textContent = "Valid! (form stopped for demo)"; return false;\n  }\n<\/script>`),
J('JavaScript: Statements',['Conditionals: if/else, switch. Loops: for, while, do-while, for...of. Control: break, continue.'],`<pre id="o"></pre>\n<script>\n  var out = "";\n  for (var i = 1; i <= 5; i++) {\n    if (i == 3) continue;\n    out += i + (i % 2 ? " odd" : " even") + "\\n";\n  }\n  var d = 2;\n  switch (d) { case 1: out += "Mon"; break; case 2: out += "Tue"; break; default: out += "?"; }\n  document.getElementById("o").textContent = out;\n<\/script>`),
J('JavaScript: Functions',['Declare: function f(a,b){return a+b}. Also function expressions and arrow functions (a,b)=>a+b. Functions are values: pass them as callbacks.'],`<pre id="o"></pre>\n<script>\n  function add(a, b){ return a + b; }\n  var mul = function(a, b){ return a * b; };\n  var sq = x => x * x;\n  function run(f, v){ return f(v); }      // callback\n  document.getElementById("o").textContent =\n    add(2,3) + "\\n" + mul(4,5) + "\\n" + sq(6) + "\\n" + run(sq, 9);\n<\/script>`),
J('JavaScript: Objects',['Object = key:value pairs (properties + methods). Create with literals, constructors or classes. JSON.stringify converts to text.'],`<pre id="o"></pre>\n<script>\n  var st = { name: "Asha", marks: [78, 85],\n    avg: function(){ return (this.marks[0] + this.marks[1]) / 2; } };\n  function Car(m){ this.model = m; }\n  var c = new Car("Swift");\n  st.city = "Noida";\n  document.getElementById("o").textContent =\n    st.name + " avg " + st.avg() + "\\n" + JSON.stringify(st) + "\\n" + c.model;\n<\/script>`),
J('Introduction to AJAX',['AJAX = Asynchronous JavaScript And XML: fetch data from the server in the background and update part of the page WITHOUT reloading.','Uses XMLHttpRequest or fetch(); usually JSON. Demo uses a built-in data URL so it works offline.'],`<button onclick="load()">Load data (AJAX)</button>\n<p id="r">Page will not reload...</p>\n<script>\n  function load(){\n    r.textContent = "Loading...";\n    fetch('data:application/json,{"msg":"Hello from server","time":"now"}')\n      .then(res => res.json())\n      .then(d => r.textContent = d.msg + " (" + d.time + ")");\n  }\n  // XMLHttpRequest style:\n  // var x = new XMLHttpRequest(); x.open("GET","data.json"); x.onload = () => ...; x.send();\n<\/script>`),
{g:'NETWORKING (JAVA)',t:'Internet Addressing',th:['Every host has an IP address (IPv4: 32-bit like 192.168.1.5; IPv6: 128-bit). DNS maps names to addresses.','Port numbers (0-65535) identify the application on a host. Socket = IP + port.'],code:`IP + port  =  socket address\n192.168.1.5 : 8080\nWell-known ports: 80 HTTP, 443 HTTPS, 21 FTP, 25 SMTP`,d:F(['Name','DNS server','IP address','Web server :80'],[[0,1,'www.abes.ac.in ?'],[1,2,'returns IP'],[2,3,'connect to IP:80'],[3,0,'page delivered']])},
{g:'NETWORKING (JAVA)',t:'InetAddress Class',th:['java.net.InetAddress represents an IP address and hostname; has no public constructor, so you use static factory methods.'],code:`import java.net.*;\nInetAddress a = InetAddress.getByName("www.google.com");\nSystem.out.println(a);   // www.google.com/142.250.x.x`,d:F(['Java code','InetAddress','DNS','Result'],[[0,1,'getByName("host")'],[1,2,'resolve name'],[2,1,'IP address'],[1,3,'object returned']])},
{g:'NETWORKING (JAVA)',t:'Factory Methods',th:['Static methods that RETURN InetAddress objects. They throw UnknownHostException. Click one.'],code:`InetAddress.getLocalHost();\nInetAddress.getByName("abes.ac.in");\nInetAddress[] all = InetAddress.getAllByName("google.com");`,d:['chips',{'getLocalHost()':'Returns the address of this computer: MyPC/192.168.1.5.','getByName(host)':'Returns ONE address for a name or IP string.','getAllByName(host)':'Returns an array: a site may have several IPs.','getByAddress(byte[])':'Builds an address from raw bytes (no DNS lookup).'}]},
{g:'NETWORKING (JAVA)',t:'Instance Methods',th:['Called on an InetAddress object to read its details. Click one.'],code:`InetAddress a = InetAddress.getByName("abes.ac.in");\na.getHostName();  a.getHostAddress();  a.getAddress();\na.isReachable(2000);  a.isLoopbackAddress();`,d:['chips',{'getHostName()':'Returns the host name as String.','getHostAddress()':'Returns IP as text, e.g. "192.168.1.5".','getAddress()':'Returns the IP as a byte array.','isReachable(ms)':'true if host replies within timeout (like ping).','isLoopbackAddress()':'true for 127.0.0.1 (this machine).','toString()':'hostname/IP'}]},
{g:'NETWORKING (JAVA)',t:'TCP/IP Client Sockets',th:['TCP is connection-oriented and reliable. The client creates new Socket(host, port), then reads/writes through streams.'],code:`Socket s = new Socket("localhost", 5000);\nPrintWriter out = new PrintWriter(s.getOutputStream(), true);\nBufferedReader in = new BufferedReader(new InputStreamReader(s.getInputStream()));\nout.println("Hello server");\nSystem.out.println(in.readLine());\ns.close();`,d:F(['Client Socket','Network','ServerSocket','Client Socket'],[[0,1,'new Socket(host,port): connect'],[1,2,'3-way handshake'],[0,2,'out.println("Hello")'],[2,3,'reply received via in.readLine()']])},
{g:'NETWORKING (JAVA)',t:'URL Class',th:['java.net.URL parses a web address: protocol, host, port, path, query, ref. openStream() reads the resource.'],code:`URL u = new URL("https://abes.ac.in:443/a/b.html?x=1#top");\nu.getProtocol();  // https\nu.getHost();      // abes.ac.in\nu.getPort();      // 443\nu.getPath();      // /a/b.html\nu.getQuery();     // x=1\nu.getRef();       // top`,d:['chips',{'getProtocol()':'https','getHost()':'abes.ac.in','getPort()':'443 (getDefaultPort() if none given)','getPath()':'/a/b.html','getQuery()':'x=1','getRef()':'top (the #fragment)','openStream()':'Returns an InputStream to read the page content.'}]},
{g:'NETWORKING (JAVA)',t:'URLConnection',th:['URL.openConnection() gives more control than openStream(): read headers, set request properties, send data (POST).','HttpURLConnection is the HTTP-specific subclass.'],code:`URL u = new URL("http://example.com");\nHttpURLConnection c = (HttpURLConnection) u.openConnection();\nc.setRequestMethod("GET");\nSystem.out.println(c.getResponseCode());\nSystem.out.println(c.getContentType());\nBufferedReader r = new BufferedReader(new InputStreamReader(c.getInputStream()));`,d:F(['Java program','URLConnection','Web server','Program'],[[0,1,'openConnection()'],[1,2,'GET request + headers'],[2,1,'200 OK + body'],[1,3,'getInputStream() reads data']])},
{g:'NETWORKING (JAVA)',t:'TCP/IP Server Sockets',th:['ServerSocket listens on a port; accept() blocks until a client connects and returns a Socket for that client.','Use a new Thread per client to serve many clients.'],code:`ServerSocket ss = new ServerSocket(5000);\nwhile (true) {\n  Socket c = ss.accept();          // waits\n  BufferedReader in = new BufferedReader(new InputStreamReader(c.getInputStream()));\n  PrintWriter out = new PrintWriter(c.getOutputStream(), true);\n  out.println("Echo: " + in.readLine());\n  c.close();\n}`,d:F(['Server','accept() waiting','Client','Server (reply)'],[[0,1,'new ServerSocket(5000)'],[2,1,'client connects'],[1,3,'accept() returns a Socket'],[3,2,'reply sent, socket closed']])},
{g:'NETWORKING (JAVA)',t:'Datagram (UDP)',th:['UDP is connectionless: no handshake, no delivery guarantee, but fast. Used in streaming, DNS, games.','Classes: DatagramSocket (endpoint) and DatagramPacket (message + address).'],code:`// Sender\nDatagramSocket ds = new DatagramSocket();\nbyte[] b = "Hi".getBytes();\nds.send(new DatagramPacket(b, b.length, InetAddress.getByName("localhost"), 9999));\n// Receiver\nDatagramSocket rs = new DatagramSocket(9999);\nDatagramPacket p = new DatagramPacket(new byte[100], 100);\nrs.receive(p);`,d:['chips',{'TCP':'Connection, reliable, ordered, slower. Socket / ServerSocket.','UDP':'No connection, may lose or reorder packets, faster. DatagramSocket / DatagramPacket.','send(packet)':'Fires the packet; sender does not know if it arrived.','receive(packet)':'Blocks until a packet arrives.'}]}
]);
</script></body></html>
