<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><script src="theme.js"></script></head><body><script src="engine.js"></script><script>
const S=(t,th,code,g)=>({g:g||'CSS BASICS',t,th,code,d:['try']});
const sp="url(\"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='50'><rect width='50' height='50' fill='crimson'/><rect x='50' width='50' height='50' fill='royalblue'/></svg>\")";
build('Unit 2 · CSS',[
S('Creating a Style Sheet',['CSS separates look from content. Rule = selector { property: value; }.','Three ways: inline (style attribute), internal (<style>), external (<link rel="stylesheet" href="a.css">). Priority: inline > internal > external.'],`<style>\n  h2 { color: teal; }          /* internal */\n</style>\n<h2>Internal style</h2>\n<h2 style="color:crimson">Inline style wins</h2>\n<!-- external: <link rel="stylesheet" href="style.css"> -->`),
S('CSS Properties and Selectors',['Selectors: element (p), class (.c), id (#i), universal (*), descendant (div p), child (div > p), group (h1,h2).','Change values and see the effect.'],`<style>\n  p { color: navy; }\n  .hl { background: yellow; }\n  div > span { font-weight: bold; }\n  #main { border: 2px dashed green; padding: 6px; }\n</style>\n<div id="main"><p>Plain p</p><p class="hl">Class hl</p><span>Child span</span></div>`),
S('Styling: Background',['background-color, background-image, background-repeat, background-position, background-size, background-attachment.'],`<style>\n  body { background: linear-gradient(120deg,#fde68a,#fca5a5); }\n  .box { height:80px; background-color:#0ea5e9; color:#fff;\n         background-image: radial-gradient(circle,#fff3 20%,transparent 21%);\n         background-size: 20px 20px; padding:10px; }\n</style>\n<div class="box">background-image + size</div>`),
S('Styling: Text Format',['color, text-align, text-decoration, text-transform, text-indent, letter-spacing, word-spacing, line-height, text-shadow.'],`<style>\n  p { text-align: justify; text-indent: 20px; line-height: 1.6; letter-spacing: 1px; }\n  h3 { text-transform: uppercase; text-decoration: underline; text-shadow: 2px 2px 3px #999; }\n</style>\n<h3>text format</h3>\n<p>CSS gives you complete control over how text looks and is spaced on the page.</p>`),
S('Styling: Controlling Fonts',['font-family (with fallback), font-size, font-weight, font-style, font-variant, shorthand: font: italic bold 18px Arial, sans-serif.'],`<style>\n  .a { font-family: Georgia, serif; font-size: 22px; }\n  .b { font: italic bold 18px Arial, sans-serif; }\n  .c { font-family: "Courier New", monospace; font-variant: small-caps; }\n</style>\n<p class="a">Serif 22px</p><p class="b">Italic bold shorthand</p><p class="c">Monospace small caps</p>`),
S('Working with Block Elements and Objects',['Block elements (div, p, h1) start on a new line and take full width. Inline elements (span, a, b) flow within a line.','display:inline-block gives inline flow with block sizing.'],`<style>\n  div { background:#bae6fd; margin:4px; }\n  span { background:#fde68a; }\n  .ib { display:inline-block; width:90px; height:40px; background:#bbf7d0; }\n</style>\n<div>Block 1</div><div>Block 2</div>\n<span>inline A</span><span>inline B</span>\n<p><span class="ib">inline-block</span><span class="ib">inline-block</span></p>`),
S('Working with Lists',['list-style-type (disc, circle, square, decimal, upper-roman), list-style-position, list-style-image. Lists can become menus.'],`<style>\n  ul { list-style-type: square; color: crimson; }\n  ol { list-style-type: upper-roman; }\n  .menu { list-style: none; padding: 0; }\n  .menu li { background:#e2e8f0; margin:3px; padding:6px; }\n</style>\n<ul><li>Square</li><li>Bullets</li></ul>\n<ol><li>Roman</li><li>Numbers</li></ol>\n<ul class="menu"><li>No bullets</li><li>Menu style</li></ul>`),
S('Working with Tables',['border-collapse, border, padding, text-align, :nth-child(even) for zebra rows, :hover for highlighting.'],`<style>\n  table { border-collapse: collapse; width: 100%; }\n  th, td { border: 1px solid #94a3b8; padding: 8px; text-align: left; }\n  th { background: #0ea5e9; color: #fff; }\n  tr:nth-child(even) { background: #f1f5f9; }\n  tr:hover td { background: #fde68a; }\n</style>\n<table><tr><th>Name</th><th>Marks</th></tr><tr><td>Asha</td><td>78</td></tr><tr><td>Ravi</td><td>65</td></tr><tr><td>Neha</td><td>91</td></tr></table>`),
S('CSS Id and Class',['#id is unique on a page; .class can be reused on many elements and combined (class="a b").'],`<style>\n  #header { background:#0ea5e9; color:#fff; padding:8px; }\n  .card { border:1px solid #94a3b8; padding:8px; margin:6px; display:inline-block; }\n  .hot { background:#fecaca; }\n</style>\n<div id="header">Unique id</div>\n<div class="card">card</div><div class="card hot">card hot</div>`,'CSS BASICS'),
S('Box Model: Introduction',['Every element is a box: content → padding → border → margin. Total width = content + padding + border + margin.','box-sizing: border-box includes padding and border in the width.'],`<style>\n  .box { width:150px; padding:20px; border:8px solid teal; margin:25px; background:#bae6fd; }\n  .bb { box-sizing: border-box; }\n</style>\n<div class="box">content-box: 150+40+16 = 206px</div>\n<div class="box bb">border-box: stays 150px</div>`,'BOX MODEL'),
S('Box Model: Border Properties',['border-width, border-style (solid, dashed, dotted, double, groove), border-color, per side (border-top), border-radius.'],`<style>\n  div { margin:8px; padding:8px; }\n  .a { border: 3px dashed crimson; }\n  .b { border-bottom: 4px double navy; border-left: 8px solid orange; }\n  .c { border: 2px solid teal; border-radius: 20px; }\n</style>\n<div class="a">dashed</div><div class="b">mixed sides</div><div class="c">rounded</div>`,'BOX MODEL'),
S('Box Model: Padding and Margin Properties',['Padding = space inside the border; Margin = space outside. Shorthand order: top right bottom left (1 to 4 values).','Vertical margins between blocks collapse; margin:auto centres a fixed-width block.'],`<style>\n  .p { padding: 5px 30px 5px 10px; background:#fde68a; }\n  .m { margin: 20px auto; width:200px; background:#bbf7d0; text-align:center; }\n</style>\n<div class="p">padding: top 5, right 30, bottom 5, left 10</div>\n<div class="m">margin: auto centres me</div>`,'BOX MODEL'),
S('Advanced: Grouping and Dimension',['Grouping selectors: h1, h2, p { ... } shares one rule. Dimension: width, height, min/max-width, max-height, overflow.'],`<style>\n  h3, p { font-family: Arial; color: #334155; }\n  .d { width: 60%; max-width: 300px; height: 50px; overflow: auto; background:#e2e8f0; }\n</style>\n<h3>Grouped</h3><p>Same rule as h3</p>\n<div class="d">Content taller than the box scrolls because overflow:auto. Line two. Line three. Line four.</div>`,'CSS ADVANCED'),
S('Advanced: Display',['display: block | inline | inline-block | none | flex | grid. visibility:hidden hides but keeps space; display:none removes it.'],`<style>\n  .flex { display:flex; gap:8px; }\n  .flex div { flex:1; background:#bae6fd; padding:10px; }\n  .gone { display:none; }\n</style>\n<div class="flex"><div>flex 1</div><div>flex 2</div><div>flex 3</div></div>\n<p class="gone">I am display:none</p><p>Hidden element above leaves no gap.</p>`,'CSS ADVANCED'),
S('Advanced: Positioning',['static (default), relative (offset from normal place), absolute (relative to nearest positioned ancestor), fixed (viewport), sticky.'],`<style>\n  .wrap { position:relative; height:120px; background:#e2e8f0; }\n  .abs { position:absolute; top:10px; right:10px; background:#f87171; padding:6px; }\n  .rel { position:relative; top:30px; left:20px; background:#4ade80; padding:6px; display:inline-block; }\n</style>\n<div class="wrap"><span class="rel">relative</span><span class="abs">absolute top/right</span></div>`,'CSS ADVANCED'),
S('Advanced: Floating and Align',['float:left/right moves an element aside and text wraps around it; clear:both stops wrapping. Centre: text-align:center, margin:auto, or flex.'],`<style>\n  .f { float:left; width:80px; height:60px; background:#38bdf8; margin:0 10px 5px 0; }\n  .clr { clear:both; }\n  .c { text-align:center; background:#fde68a; }\n</style>\n<div class="f">float</div><p>Text wraps around the floated box until we clear the float. More text goes here to show wrapping beside the box.</p>\n<div class="clr"></div><div class="c">centred text</div>`,'CSS ADVANCED'),
S('Advanced: Pseudo-class',['Pseudo-class = special state: :hover, :active, :focus, :visited, :first-child, :nth-child(n). Pseudo-element: ::before, ::after, ::first-letter.'],`<style>\n  a:hover { color:crimson; }\n  button:active { transform: scale(.9); }\n  input:focus { outline:3px solid orange; }\n  li:first-child { font-weight:bold; }\n  p::first-letter { font-size:30px; color:teal; }\n</style>\n<a href="#">hover me</a> <button>press</button> <input placeholder="focus me">\n<ul><li>first-child</li><li>second</li></ul><p>First letter styled</p>`,'CSS ADVANCED'),
S('Advanced: Navigation Bar',['A nav bar is a styled list: remove bullets, float or flex the items, style links, add :hover.'],`<style>\n  ul { list-style:none; margin:0; padding:0; display:flex; background:#0f172a; }\n  li a { display:block; color:#fff; padding:12px 18px; text-decoration:none; }\n  li a:hover { background:#38bdf8; color:#000; }\n</style>\n<ul><li><a href="#">Home</a></li><li><a href="#">Syllabus</a></li><li><a href="#">Notes</a></li><li><a href="#">Contact</a></li></ul>`,'CSS ADVANCED'),
S('Advanced: Image Sprites',['A sprite is ONE image holding many small images; background-position shows the needed part. Fewer HTTP requests = faster page.'],`<style>\n  .s { width:50px; height:50px; display:inline-block; background-image:${sp}; }\n  .r { background-position: 0 0; }\n  .b { background-position: -50px 0; }\n  .b:hover { background-position: 0 0; }\n</style>\n<span class="s r"></span> <span class="s b"></span> (hover the second: position changes)`,'CSS ADVANCED'),
S('Advanced: Attribute Selector',['[attr], [attr=value], [attr^=start], [attr$=end], [attr*=contains] select by attribute.'],`<style>\n  a[target] { color:crimson; }\n  input[type=text] { background:#fef9c3; }\n  a[href$=".pdf"]::after { content:" (PDF)"; }\n  a[href^="https"] { font-weight:bold; }\n</style>\n<a href="x.pdf">notes</a><br><a href="https://a.com" target="_blank">secure</a><br><input type="text"> <input type="password">`,'CSS ADVANCED'),
S('CSS Color',['Formats: names (red), hex (#38bdf8), rgb(56,189,248), rgba (with transparency), hsl(hue,sat,light). Change values below.'],`<style>\n  div { padding:10px; margin:4px; color:#fff; }\n  .a { background:tomato; } .b { background:#2563eb; }\n  .c { background:rgb(34,197,94); } .d { background:rgba(0,0,0,.4); color:#000; }\n  .e { background:hsl(280,70%,50%); }\n</style>\n<div class="a">name</div><div class="b">hex</div><div class="c">rgb</div><div class="d">rgba</div><div class="e">hsl</div>`,'COLOR AND LAYOUT'),
S('Creating Page Layout and Site Design',['Classic layout: header, nav, main + sidebar, footer. Use CSS Grid/Flexbox; add @media queries for mobile.'],`<style>\n  body{margin:0;font-family:Arial}\n  .g { display:grid; grid-template-columns: 1fr 3fr; gap:6px; }\n  .g>div { padding:10px; background:#e2e8f0; }\n  .h,.f { grid-column:1/3; background:#0ea5e9!important; color:#fff; }\n  @media(max-width:350px){ .g{grid-template-columns:1fr} .h,.f{grid-column:1} }\n</style>\n<div class="g"><div class="h">Header</div><div>Sidebar</div><div>Main content</div><div class="f">Footer</div></div>`,'COLOR AND LAYOUT')
]);
</script></body></html>
